name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BankingApi.slnx

      - name: Build
        run: dotnet build BankingApi.slnx -c Release --no-restore

      - name: Test
        run: dotnet test BankingApi.slnx -c Release --no-build --verbosity normal

  docker:
    name: Build and push ${{ matrix.name }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            repository: ${{ vars.ECR_API_REPOSITORY }}
            dockerfile: BankingApi/Dockerfile
          - name: web
            repository: ${{ vars.ECR_WEB_REPOSITORY }}
            dockerfile: BankingWeb/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        env:
          REPOSITORY: ${{ matrix.repository }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f "$DOCKERFILE" -t "$REPOSITORY:$TAG" -t "$REPOSITORY:latest" .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.repository }}
          TAG: ${{ github.sha }}
        run: |
          docker tag "$REPOSITORY:$TAG" "$REGISTRY/$REPOSITORY:$TAG"
          docker tag "$REPOSITORY:latest" "$REGISTRY/$REPOSITORY:latest"
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

