name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "BankingApi/**"
      - "BankingWeb/**"
      - "BankingApi.slnx"
      - ".github/workflows/ci-cd.yaml"
  pull_request:
    branches: [main]
    paths:
      - "BankingApi/**"
      - "BankingWeb/**"
      - "BankingApi.slnx"
      - ".github/workflows/ci-cd.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BankingApi.slnx

      - name: Build
        run: dotnet build BankingApi.slnx -c Release --no-restore

      - name: Test
        run: dotnet test BankingApi.slnx -c Release --no-build --verbosity normal

  docker:
    name: Build and push ${{ matrix.name }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            repository: ${{ vars.ECR_API_REPOSITORY }}
            dockerfile: BankingApi/Dockerfile
          - name: web
            repository: ${{ vars.ECR_WEB_REPOSITORY }}
            dockerfile: BankingWeb/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        env:
          REPOSITORY: ${{ matrix.repository }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f "$DOCKERFILE" -t "$REPOSITORY:$TAG" -t "$REPOSITORY:latest" .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.repository }}
          TAG: ${{ github.sha }}
        run: |
          docker tag "$REPOSITORY:$TAG" "$REGISTRY/$REPOSITORY:$TAG"
          docker tag "$REPOSITORY:latest" "$REGISTRY/$REPOSITORY:latest"
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

  # CD: force each ECS service to redeploy with the image just pushed.
  # Task definitions reference the `latest` tag, so a forced new deployment
  # is enough to pick up the new image; no task definition changes needed.
  deploy:
    name: Deploy ${{ matrix.name }} to ECS
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            cluster: ${{ vars.ECS_API_CLUSTER }}
            service: ${{ vars.ECS_API_SERVICE }}
          - name: web
            cluster: ${{ vars.ECS_WEB_CLUSTER }}
            service: ${{ vars.ECS_WEB_SERVICE }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Roll out service
        run: aws ecs update-service --cluster "${{ matrix.cluster }}" --service "${{ matrix.service }}" --force-new-deployment

      - name: Wait for service to stabilize
        run: aws ecs wait services-stable --cluster "${{ matrix.cluster }}" --services "${{ matrix.service }}"
